<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Inquiry Form</title>
</head>
<body>

<form id="inquiryForm">
  <input type="text" name="name" placeholder="Name" required><br><br>

  <input type="email" name="email" placeholder="Email" required><br><br>

  <input type="text" name="phone" placeholder="Phone"><br><br>

  <textarea name="message" placeholder="Your Inquiry"></textarea><br><br>

  <button type="submit">Submit</button>
</form>

<p id="result"></p>

<script>
const scriptURL = "https://script.google.com/macros/s/AKfycbxCr92_59BezR2Th5CBu0wBPYaJsWbGxPlFTVTbrQr9SfvYs-zHftXIhFiJ5tJ0iCnG7w/exec";

document.getElementById("inquiryForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const formData = new FormData(this);

    fetch(scriptURL, {
        method: "POST",
        body: formData
    })
    .then(res => res.text())
    .then(data => {
        document.getElementById("result").innerHTML = "Inquiry submitted successfully!";
        document.getElementById("inquiryForm").reset();
    })
    .catch(err => {
        document.getElementById("result").innerHTML = "Error submitting inquiry.";
        console.error(err);
    });
});
</script>

</body>
</html>
